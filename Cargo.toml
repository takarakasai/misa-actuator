[workspace]
resolver = "2"

# The GUI is excluded from the default set because building it needs the
# front end built first (`cd ui && npm ci && npm run build`) — Tauri embeds
# `ui/dist` at compile time. Keeping it out means a plain `cargo build` /
# `cargo test` still works with nothing but a Rust toolchain, which is how
# everything else in here is used. Build it explicitly with
# `cargo build -p misa-actuator-gui`.
default-members = [
    "crates/misa-actuator",
    "crates/misa-actuator-tui",
    "crates/misa-can",
    "crates/misa-actuator-sim",
    "crates/misa-actuator-core",
    "crates/lkmotor-protocol",
    "crates/lkmotor-driver",
    "crates/lkmotor-cli",
    "crates/robstride-protocol",
    "crates/robstride-driver",
    "crates/robstride-cli",
    "crates/damiao-protocol",
    "crates/damiao-driver",
    "crates/damiao-cli",
    "crates/myactuator-protocol",
    "crates/myactuator-driver",
    "crates/myactuator-cli",
    "crates/misa-sysid",
]

members = [
    "crates/misa-actuator",
    "crates/misa-actuator-tui",
    "crates/misa-can",
    "crates/misa-actuator-sim",
    "crates/misa-actuator-core",
    "crates/lkmotor-protocol",
    "crates/lkmotor-driver",
    "crates/lkmotor-cli",
    "crates/robstride-protocol",
    "crates/robstride-driver",
    "crates/robstride-cli",
    "crates/damiao-protocol",
    "crates/damiao-driver",
    "crates/damiao-cli",
    "crates/myactuator-protocol",
    "crates/myactuator-driver",
    "crates/myactuator-cli",
    "crates/misa-sysid",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Takara Kasai <takara.kasai@gmail.com>"]
repository = "https://github.com/kasai-takara/misa-actuator"

[workspace.dependencies]
# Workspace-internal crates
misa-actuator = { path = "crates/misa-actuator", version = "0.1.0" }
misa-can = { path = "crates/misa-can", version = "0.1.0" }
misa-actuator-sim = { path = "crates/misa-actuator-sim", version = "0.1.0" }
misa-actuator-core = { path = "crates/misa-actuator-core", version = "0.1.0" }
lkmotor-protocol = { path = "crates/lkmotor-protocol", version = "0.1.0" }
lkmotor-driver = { path = "crates/lkmotor-driver", version = "0.1.0" }
robstride-protocol = { path = "crates/robstride-protocol", version = "0.1.0" }
robstride-driver = { path = "crates/robstride-driver", version = "0.1.0" }
damiao-protocol = { path = "crates/damiao-protocol", version = "0.1.0" }
damiao-driver = { path = "crates/damiao-driver", version = "0.1.0" }
myactuator-protocol = { path = "crates/myactuator-protocol", version = "0.1.0" }
myactuator-driver = { path = "crates/myactuator-driver", version = "0.1.0" }
misa-sysid = { path = "crates/misa-sysid", version = "0.1.0" }

# Shared third-party deps
serialport = "4"
socketcan = "3.3"
embedded-can = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
confy = "0.6"
rustfft = "6"
