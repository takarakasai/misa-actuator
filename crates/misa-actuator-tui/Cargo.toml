[package]
name = "misa-actuator-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Driver-agnostic ratatui debug TUI for any misa-actuator-compatible motor driver"

[dependencies]
misa-actuator = { workspace = true }
misa-can = { workspace = true }
misa-actuator-core = { workspace = true, features = ["clap"] }
lkmotor-driver = { workspace = true }
robstride-driver = { workspace = true }
damiao-driver = { workspace = true }
myactuator-driver = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
confy = { workspace = true }

[lib]
name = "misa_actuator_tui"
path = "src/lib.rs"

[[bin]]
name = "misa-actuator-tui"
path = "src/main.rs"
