[package]
name = "myactuator-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line test app for MyActuator RMD servo motors (CAN protocol V3)"

[dependencies]
myactuator-driver = { workspace = true }
myactuator-protocol = { workspace = true }
misa-actuator = { workspace = true }
misa-sysid = { workspace = true, features = ["cli"] }
log = { workspace = true }
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "myactuator-cli"
path = "src/main.rs"
